# Replace BRIDGE_IP with the existing bridge IPv4 address before validation.
# TLS is passed through; no certificate, subscription or admin secret lives here.
global
    log stdout format raw local0
    user haproxy
    group haproxy
    maxconn 2048

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    # Deliberately omit tcplog/httplog: only backend state changes are logged.

frontend subscriptions
    bind 0.0.0.0:443
    bind 0.0.0.0:8444
    default_backend bot_tls

backend bot_tls
    option log-health-checks
    server bridge BRIDGE_IP:8444 check inter 10s fall 3 rise 2

# Existing certbot on bridge uses standalone HTTP-01 during renewal.
frontend acme
    bind 0.0.0.0:80
    mode http
    acl challenge path_beg /.well-known/acme-challenge/
    http-request deny unless challenge
    default_backend bridge_acme

backend bridge_acme
    mode http
    server bridge BRIDGE_IP:80
