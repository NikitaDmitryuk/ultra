---
- name: Select the frozen host rollback manifest
  ansible.builtin.set_fact:
    release_previous_manifest: "{{ ultra_host_previous_manifest | default(ultra_previous_manifest) }}"
- name: Require the emergency relay fallback to read the target schema
  ansible.builtin.assert:
    that:
      - "'service-access-v1' in ultra_previous_relay_manifest.capabilities"
      - "'provider-pool-quota-v1' in ultra_previous_relay_manifest.capabilities"
      - ultra_previous_relay_manifest.database_schema_min | int <= ultra_release_manifest.database_schema_min | int
      - ultra_previous_relay_manifest.database_schema_max | int >= ultra_release_manifest.database_schema_max | int
  when: release_component == 'ultra-relay' and ultra_previous_relay_manifest is defined
- name: Resolve the compatible rollback component
  ansible.builtin.set_fact:
    release_rollback_name: "{{ release_component }}-linux-{{ ultra_architecture }}"
- name: Require the preserved compatible manifest
  ansible.builtin.assert:
    that:
      - release_component in ['ultra-relay', 'ultra-bot']
      - ultra_architecture in ['amd64', 'arm64']
      - ultra_release_version is ansible.builtin.match('^v[0-9]+\.[0-9]+\.[0-9]+$')
      - "'provider-pool-quota-v1' in release_previous_manifest.capabilities"
      - "'service-access-v1' in release_previous_manifest.capabilities"
      - release_previous_manifest.database_schema_max | int >= ultra_release_manifest.database_schema_max | int
      - release_previous_manifest.database_schema_min | int <= ultra_release_manifest.database_schema_min | int
      - >-
        (ultra_previous_relay_manifest.assets
        if release_component == 'ultra-relay' and ultra_previous_relay_manifest is defined
        else release_previous_manifest.assets) |
        selectattr('name', 'equalto', release_rollback_name) | list | length == 1
- name: Read the expected compatible hash
  ansible.builtin.set_fact:
    release_rollback_asset: >-
      {{ (ultra_previous_relay_manifest.assets
          if release_component == 'ultra-relay' and ultra_previous_relay_manifest is defined
          else release_previous_manifest.assets) |
         selectattr('name', 'equalto', release_rollback_name) | first }}
- name: Inspect the active code during rollback
  ansible.builtin.stat:
    path: "/usr/local/bin/{{ release_component }}"
    checksum_algorithm: sha256
    follow: false
  register: release_rollback_active
- name: Restore compatible code if activation happened
  when: release_rollback_active.stat.checksum | default('') != release_rollback_asset.sha256
  block:
    - name: Inspect the saved compatible code
      ansible.builtin.stat:
        path: "/var/lib/ultra-ansible/releases/{{ ultra_release_version }}/{{ release_component }}.previous"
        checksum_algorithm: sha256
        follow: false
      register: release_saved
    - name: Require verified saved compatible code
      ansible.builtin.assert:
        that:
          - release_saved.stat.isreg | default(false)
          - not release_saved.stat.islnk | default(false)
          - release_saved.stat.checksum == release_rollback_asset.sha256
    - name: Restore executable bytes without touching data or configuration
      ansible.builtin.copy:
        src: "/var/lib/ultra-ansible/releases/{{ ultra_release_version }}/{{ release_component }}.previous"
        dest: "/usr/local/bin/{{ release_component }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
    - name: Restart the restored component
      ansible.builtin.systemd_service:
        name: "{{ release_component }}.service"
        state: restarted
- name: Verify exact restored bytes even when the fallback was already installed
  ansible.builtin.stat:
    path: "/usr/local/bin/{{ release_component }}"
    checksum_algorithm: sha256
    follow: false
  register: release_rollback_verified
- name: Require the exact regular restored component before readiness
  ansible.builtin.assert:
    that:
      - release_rollback_verified.stat.isreg | default(false)
      - not release_rollback_verified.stat.islnk | default(false)
      - release_rollback_verified.stat.checksum == release_rollback_asset.sha256
      - release_rollback_verified.stat.size | int == release_rollback_asset.size | int
