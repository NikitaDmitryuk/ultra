---
- name: Inspect a retained pre-publication manifest
  ansible.builtin.stat:
    path: "/var/lib/ultra-ansible/releases/{{ ultra_release_version }}/manifest.previous"
    checksum_algorithm: sha256
    follow: false
  register: release_rollback_manifest
- name: Require an intact retained identity when publication began
  ansible.builtin.assert:
    that:
      - release_rollback_manifest.stat.isreg | default(false)
      - not release_rollback_manifest.stat.islnk | default(false)
      - release_rollback_manifest.stat.checksum == ultra_previous_manifest_sha256
  when: release_rollback_manifest.stat.exists
- name: Restore exact previous manifest bytes without rolling back data
  ansible.builtin.copy:
    src: "/var/lib/ultra-ansible/releases/{{ ultra_release_version }}/manifest.previous"
    dest: /opt/ultra-recovery/release-manifest.json
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  when: release_rollback_manifest.stat.exists
- name: Inspect a retained original signature
  ansible.builtin.stat:
    path: "/var/lib/ultra-ansible/releases/{{ ultra_release_version }}/manifest.previous.minisig"
    follow: false
  register: release_rollback_signature
- name: Restore the previous original signature
  ansible.builtin.copy:
    src: "/var/lib/ultra-ansible/releases/{{ ultra_release_version }}/manifest.previous.minisig"
    dest: /opt/ultra-recovery/release-manifest.json.minisig
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  when:
    - release_rollback_manifest.stat.exists
    - release_rollback_signature.stat.isreg | default(false)
- name: Remove target signature after restoring an unsigned predecessor
  ansible.builtin.file:
    path: /opt/ultra-recovery/release-manifest.json.minisig
    state: absent
  when:
    - release_rollback_manifest.stat.exists
    - not release_rollback_signature.stat.exists
- name: Read the current private backup policy
  ansible.builtin.slurp:
    src: /etc/ultra-recovery/backup.json
  register: release_rollback_backup_policy
  when:
    - release_rollback_manifest.stat.exists
    - not release_rollback_signature.stat.exists
  no_log: true
- name: Remove a now unavailable active signature from the backup policy
  ansible.builtin.copy:
    content: >-
      {{ release_rollback_backup_policy.content | b64decode | from_json |
      combine({'artifact_paths': (release_rollback_backup_policy.content | b64decode | from_json).artifact_paths |
      reject('equalto', '/opt/ultra-recovery/release-manifest.json.minisig') | list}) | to_nice_json(preprocess_unsafe=False) }}
    dest: /etc/ultra-recovery/backup.json
    owner: root
    group: root
    mode: "0600"
  when:
    - release_rollback_manifest.stat.exists
    - not release_rollback_signature.stat.exists
  no_log: true
  diff: false
