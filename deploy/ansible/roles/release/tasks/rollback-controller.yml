---
- name: Inspect the recorded controller service fallback
  ansible.builtin.stat:
    path: "/var/lib/ultra-ansible/releases/{{ ultra_release_version }}/controller.service.previous"
    checksum_algorithm: sha256
    follow: false
  register: release_controller_saved
- name: Restore the previous immutable controller if it was switched
  when: release_controller_saved.stat.exists
  block:
    - name: Require the verified compatible service definition
      ansible.builtin.assert:
        that:
          - release_controller_saved.stat.isreg | default(false)
          - not release_controller_saved.stat.islnk | default(false)
          - release_controller_saved.stat.checksum == ultra_previous_controller_unit_sha256
          - ultra_previous_controller_directory is match('^/opt/ultra-ansible/releases/[A-Za-z0-9][A-Za-z0-9._-]{0,95}$')
    - name: Restore the compatible controller unit
      ansible.builtin.copy:
        src: "/var/lib/ultra-ansible/releases/{{ ultra_release_version }}/controller.service.previous"
        dest: /etc/systemd/system/ultra-ansible-controller.service
        remote_src: true
        owner: root
        group: root
        mode: "0644"
    - name: Select the retained compatible immutable runtime
      ansible.builtin.file:
        src: "{{ ultra_previous_controller_directory }}"
        dest: /opt/ultra-ansible/current
        state: link
    - name: Restart the compatible independent controller
      ansible.builtin.systemd_service:
        name: ultra-ansible-controller.service
        state: restarted
        daemon_reload: true
    - name: Align recovery metadata with the restored compatible controller
      ansible.builtin.include_tasks: backup-identity.yml
      vars:
        release_backup_controller_directory: "{{ ultra_previous_controller_directory }}"
