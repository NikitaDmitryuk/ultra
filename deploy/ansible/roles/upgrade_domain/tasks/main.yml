---
- name: Require the bounded coordinated domain phase
  ansible.builtin.assert:
    that:
      - ultra_upgrade_domain_action in ['apply', 'accept', 'rollback', 'retire', 'finalize']
      - ultra_ingress.retain_aliases | bool
- name: Provision new certificates without changing the published relay
  ansible.builtin.include_role:
    name: ingress
  vars:
    ingress_action: prepare
  when: ultra_upgrade_domain_action == 'apply'
- name: Prepare exact backend compensation on the host
  ultra_backend_domain:
    directory: "{{ ultra_backend_transaction }}"
    action: prepare
    old: "{{ ultra_backend_old_domain }}"
    new: "{{ ultra_bot_domain }}"
    public: "{{ ultra_backend_old_public }}"
    old_port: "{{ ultra_backend_old_port }}"
    new_port: "{{ ultra_bot_port }}"
    preserve_recovery: true
  when:
    - ultra_upgrade_domain_action == 'apply'
    - ultra_backend_changed | bool
  no_log: true
- name: Apply exact backend candidate
  ultra_backend_domain:
    directory: "{{ ultra_backend_transaction }}"
    action: activate
    old: "{{ ultra_backend_old_domain }}"
    new: "{{ ultra_bot_domain }}"
    public: "{{ ultra_backend_old_public }}"
    old_port: "{{ ultra_backend_old_port }}"
    new_port: "{{ ultra_bot_port }}"
    preserve_recovery: true
  when:
    - ultra_upgrade_domain_action == 'apply'
    - ultra_backend_changed | bool
  no_log: true
- name: Restart candidate backend with its new certificate
  ansible.builtin.systemd_service:
    name: ultra-bot.service
    state: restarted
  when:
    - ultra_upgrade_domain_action == 'apply'
    - ultra_backend_changed | bool
- name: Verify candidate backend TLS and application
  ultra_ingress_probe:
    kind: bot
  register: upgrade_domain_backend_ready
  until: upgrade_domain_backend_ready.ready | default(false)
  retries: 15
  delay: 2
  when: ultra_upgrade_domain_action in ['apply', 'accept']
  no_log: true
- name: Validate candidate backend proxy names before reloading old aliases
  ansible.builtin.command:
    argv: [nginx, -t]
  changed_when: false
  when:
    - ultra_upgrade_domain_action == 'apply'
    - ultra_backend_changed | bool
- name: Reload old listeners with the matching candidate backend SNI
  ansible.builtin.systemd_service:
    name: nginx.service
    state: reloaded
  when:
    - ultra_upgrade_domain_action == 'apply'
    - ultra_backend_changed | bool
- name: Bind the unchanged ownership baseline before ingress publication
  ultra_upgrade_domain:
    action: baseline
    ingress_transaction: "{{ ultra_ingress_transaction }}"
  when: ultra_upgrade_domain_action == 'apply'
  no_log: true
- name: Apply retained-alias cutover through the native ingress role
  ansible.builtin.include_role:
    name: ingress
  vars:
    ingress_action: cutover
    ingress_defer_finalize: true
  when: ultra_upgrade_domain_action == 'apply'
- name: Bind applied ingress ownership hashes for exact compensation
  ultra_upgrade_domain:
    action: seal
    ingress_transaction: "{{ ultra_ingress_transaction }}"
  when: ultra_upgrade_domain_action == 'apply'
  no_log: true
- name: Refuse changed ingress ownership or files before compensation
  ultra_upgrade_domain:
    action: validate
    ingress_transaction: "{{ ultra_ingress_transaction }}"
  when: ultra_upgrade_domain_action == 'rollback'
  no_log: true
- name: Inspect existing ingress journal before compensation
  ansible.builtin.stat:
    path: "{{ ultra_ingress_transaction }}/state.json"
    follow: false
  register: upgrade_domain_ingress_journal
  when: ultra_upgrade_domain_action == 'rollback'
- name: Restore exact ingress specification and obtain owned before images
  ultra_ingress_state:
    directory: "{{ ultra_ingress_transaction }}"
    plan: "{{ ultra_ingress }}"
    action: cutover
    phase: rollback
  register: upgrade_domain_ingress_restored
  when:
    - ultra_upgrade_domain_action == 'rollback'
    - upgrade_domain_ingress_journal.stat.exists | default(false)
  no_log: true
- name: Restore only journalled ingress owned files
  ultra_owned_file:
    path: "{{ item.path }}"
    receipt: /var/lib/ultra-ingress/managed.json
    state: "{{ 'present' if item.present else 'absent' }}"
    content: "{{ item.content | b64decode }}"
    mode: "{{ item.mode }}"
  loop: "{{ upgrade_domain_ingress_restored.owned_before_images | default([]) }}"
  when: ultra_upgrade_domain_action == 'rollback'
  no_log: true
- name: Restore exact backend files after restoring ingress
  ultra_backend_domain:
    directory: "{{ ultra_backend_transaction }}"
    action: rollback
    old: "{{ ultra_backend_old_domain }}"
    new: "{{ ultra_bot_domain }}"
    public: "{{ ultra_backend_old_public }}"
    old_port: "{{ ultra_backend_old_port }}"
    new_port: "{{ ultra_bot_port }}"
    preserve_recovery: true
  when:
    - ultra_upgrade_domain_action == 'rollback'
    - ultra_backend_changed | bool
  no_log: true
- name: Check restored listeners
  ansible.builtin.command:
    argv: [nginx, -t]
  changed_when: false
  when: ultra_upgrade_domain_action == 'rollback'
- name: Reload restored listeners and bot public origin
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop: [nginx.service, ultra-bot.service, ultra-relay.service]
  when: ultra_upgrade_domain_action == 'rollback'
