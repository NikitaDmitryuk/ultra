---
- name: Require an explicit database tunnel role stage
  ansible.builtin.assert:
    that:
      - db_tunnel_ultra_stage | default('') in ['generate', 'authorize', 'install']
    fail_msg: Set db_tunnel_ultra_stage to generate, authorize, or install for the three-stage bridge/database/bridge contract.

- name: Run selected database tunnel stage
  ansible.builtin.include_tasks: "{{ db_tunnel_ultra_stage }}.yml"
