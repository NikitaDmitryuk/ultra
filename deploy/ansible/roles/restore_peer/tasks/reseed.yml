---
- name: Check owned standby retirement before stopping any service
  ansible.builtin.command:
    argv: [python3, "/var/lib/ultra-restore/{{ ultra_peer_plan.restore_id }}/restore_peer.py"]
    stdin: "{{ ultra_peer_plan | combine({'action': 'reseed-check'}) | to_json(preprocess_unsafe=False) }}"
  register: restore_peer_check
  changed_when: false
  no_log: true
- name: Stop only an owned standby belonging to the fenced primary
  ansible.builtin.systemd_service:
    name: ultra-postgres-replica.service
    state: stopped
  when: (restore_peer_check.stdout | from_json).needs_stop
- name: Inspect optional peer firewall
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: restore_peer_ufw
- name: Inspect peer firewall activation
  ansible.builtin.command:
    argv: [ufw, status]
  changed_when: false
  register: restore_peer_firewall_status
  when: restore_peer_ufw.stat.exists
- name: Admit only new bridge to the saved tunnel port
  ansible.builtin.command:
    argv: [ufw, allow, from, "{{ ultra_peer_plan.new_bridge_address }}", to, any, port, "{{ ultra_peer_plan.tunnel_port | string }}", proto, tcp]
  register: restore_peer_firewall
  changed_when: "'Skipping' not in restore_peer_firewall.stdout"
  when:
    - restore_peer_firewall_status.stdout is defined
    - "'Status: active' in restore_peer_firewall_status.stdout"
- name: Retire authenticated standby data without deleting it
  ansible.builtin.command:
    argv: [python3, "/var/lib/ultra-restore/{{ ultra_peer_plan.restore_id }}/restore_peer.py"]
    stdin: "{{ ultra_peer_plan | to_json(preprocess_unsafe=False) }}"
  changed_when: false
  no_log: true
