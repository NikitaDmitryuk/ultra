---
- name: Inspect legacy automatic release units
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item.name }}"
    get_checksum: true
    checksum_algorithm: sha256
    follow: false
  loop:
    - {name: ultra-auto-upgrade.service, sha256: e53a052444834db11f1a3a88b0473f2e484b148c9435a23379c01b26abcb4112}
    - {name: ultra-auto-upgrade.timer, sha256: c50e1fcdd70106ea222433707f663d8900dc72d2e2fd7db00f7dd97265ab2074}
  register: controller_legacy_auto_upgrade_units
- name: Refuse to remove modified automatic release units
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isreg and not item.stat.islnk and item.stat.checksum == item.item.sha256)
    fail_msg: legacy_auto_upgrade_unit_drift
  loop: "{{ controller_legacy_auto_upgrade_units.results }}"
- name: Stop the verified legacy release timer
  ansible.builtin.systemd_service:
    name: ultra-auto-upgrade.timer
    enabled: false
    state: stopped
  when: controller_legacy_auto_upgrade_units.results[1].stat.exists
- name: Refuse to interrupt a running legacy release operation
  ansible.builtin.command:
    argv: [systemctl, is-active, --quiet, ultra-auto-upgrade.service]
  register: controller_legacy_auto_upgrade_active
  changed_when: false
  failed_when: controller_legacy_auto_upgrade_active.rc == 0
  when: controller_legacy_auto_upgrade_units.results[0].stat.exists
- name: Remove verified legacy automatic release units
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item.item.name }}"
    state: absent
  loop: "{{ controller_legacy_auto_upgrade_units.results }}"
  when: item.stat.exists
- name: Reload systemd after retiring legacy release units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: controller_legacy_auto_upgrade_units.results | selectattr('stat.exists') | list | length > 0
