---
- name: Populate and seal the immutable controller runtime
  ansible.builtin.import_tasks: runtime-files.yml
- name: Select the verified controller runtime
  ansible.builtin.file:
    src: "{{ ultra_controller_directory }}"
    dest: /opt/ultra-ansible/current
    state: link
    owner: root
    group: root
- name: Install the independent controller service
  ansible.builtin.template:
    src: ultra-ansible-controller.service.j2
    dest: /etc/systemd/system/ultra-ansible-controller.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Ansible controller
