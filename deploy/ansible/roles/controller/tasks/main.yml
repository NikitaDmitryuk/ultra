---
- name: Require an immutable controller release directory
  ansible.builtin.assert:
    that:
      - ultra_controller_directory is ansible.builtin.match('^/opt/ultra-ansible/releases/[A-Za-z0-9][A-Za-z0-9._-]{0,95}$')
- name: Ensure the controller Python environment prerequisites
  ansible.builtin.apt:
    name: [python3-venv, minisign]
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Install the immutable broker runtime and service
  ansible.builtin.import_tasks: runtime.yml
- name: Record the private physical deployment identity
  ansible.builtin.import_tasks: identity.yml
- name: Open only the exact proof-bound recovery candidate before startup
  ultra_controller_enforcement:
    action: open-recovery
    recovery_request_sha256: "{{ ultra_recovery_preparation_request_sha256 }}"
    operation_id: "{{ ultra_lifecycle_id }}"
    scope_sha256: "{{ ultra_controller_enforcement_spec.scope_sha256 }}"
    manifest_sha256: "{{ ultra_release_manifest_sha256 }}"
    candidate: "{{ ultra_controller_enforcement_spec.candidates[ultra_architecture].identity }}"
    proof: "{{ ultra_controller_enforcement_spec.proof }}"
    phase: before
  when: ultra_recovery_preparation_request_sha256 | default('') | length > 0
  no_log: true
- name: Ensure the controller is running
  ansible.builtin.systemd_service:
    name: ultra-ansible-controller.service
    enabled: true
    state: started
    daemon_reload: true
- name: Retire the previously installed automatic release timer
  ansible.builtin.import_tasks: retire-auto-upgrade.yml
