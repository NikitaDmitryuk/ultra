---
- name: Require an immutable controller release directory
  ansible.builtin.assert:
    that:
      - ultra_controller_directory is ansible.builtin.match('^/opt/ultra-ansible/releases/[A-Za-z0-9][A-Za-z0-9._-]{0,95}$')
- name: Ensure the controller Python environment prerequisites
  ansible.builtin.apt:
    name: [python3-venv, minisign]
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Install the immutable broker runtime and service
  ansible.builtin.import_tasks: runtime.yml
- name: Record the private physical deployment identity
  ansible.builtin.import_tasks: identity.yml
- name: Ensure the controller is running
  ansible.builtin.systemd_service:
    name: ultra-ansible-controller.service
    enabled: true
    state: started
    daemon_reload: true
- name: Retire the previously installed automatic release timer
  ansible.builtin.import_tasks: retire-auto-upgrade.yml
