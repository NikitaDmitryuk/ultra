---
- name: Require runtime fleet authorization on a verified exit
  ansible.builtin.assert:
    that:
      - inventory_hostname in groups['exits']
      - hostvars['bridge'].fleet_access_ultra_public_key is match('^ssh-ed25519 [A-Za-z0-9+/]+={0,2}(?: .*)?$')
  no_log: true
- name: Inspect root SSH authorization paths
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: [/root/.ssh, /root/.ssh/authorized_keys]
  register: fleet_access_authorization_paths
- name: Reject symlink fleet authorization paths
  ansible.builtin.assert:
    that: not item.stat.islnk | default(false)
  loop: "{{ fleet_access_authorization_paths.results }}"
- name: Ensure private root authorization directory
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"
- name: Authorize runtime fleet access without replacing operator keys
  ansible.builtin.blockinfile:
    path: /root/.ssh/authorized_keys
    create: true
    owner: root
    group: root
    mode: "0600"
    marker: "# {mark} ultra-managed-fleet-access"
    block: "restrict {{ hostvars['bridge'].fleet_access_ultra_public_key }}"
  no_log: true
