---
- name: Require fleet controller identity generation on bridge
  ansible.builtin.assert:
    that: inventory_hostname == 'bridge'
- name: Ensure fleet SSH client available
  ansible.builtin.apt:
    name: openssh-client
    state: present
- name: Inspect root-controlled fleet identity ancestry before mutation
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: [/etc, /etc/ultra-fleet]
  register: fleet_identity_ancestry
- name: Reject writable or linked fleet identity ancestry
  ansible.builtin.assert:
    that:
      - not item.stat.exists or item.stat.isdir | default(false)
      - not item.stat.islnk | default(false)
      - not item.stat.exists or item.stat.uid == 0
      - not item.stat.exists or item.stat.mode in ['0755', '0750', '0700']
  loop: "{{ fleet_identity_ancestry.results }}"
- name: Create private runtime fleet identity directory
  ansible.builtin.file:
    path: /etc/ultra-fleet
    state: directory
    owner: root
    group: ultra-relay
    mode: "0750"
- name: Inspect existing fleet identity files
  ansible.builtin.stat:
    path: "/etc/ultra-fleet/{{ item }}"
    follow: false
  loop: [id_ed25519, id_ed25519.pub]
  register: fleet_existing_identity
- name: Reject non-regular fleet identity files
  ansible.builtin.assert:
    that:
      - not item.stat.exists or item.stat.isreg | default(false)
      - not item.stat.islnk | default(false)
  loop: "{{ fleet_existing_identity.results }}"
- name: Generate runtime fleet identity only when absent
  ansible.builtin.command:
    argv: [ssh-keygen, -q, -t, ed25519, -N, '', -C, ultra-fleet-access, -f, /etc/ultra-fleet/id_ed25519]
    creates: /etc/ultra-fleet/id_ed25519
  no_log: true
- name: Derive runtime public key from the retained private identity
  ansible.builtin.command:
    argv: [ssh-keygen, -y, -f, /etc/ultra-fleet/id_ed25519]
  register: fleet_public_key
  changed_when: false
  no_log: true
- name: Persist matching runtime fleet public identity
  ansible.builtin.copy:
    content: "{{ fleet_public_key.stdout | trim }}\n"
    dest: /etc/ultra-fleet/id_ed25519.pub
    owner: root
    group: ultra-relay
    mode: "0644"
  no_log: true
- name: Keep fleet private identity available only to the runtime owner
  ansible.builtin.file:
    path: /etc/ultra-fleet/id_ed25519
    state: file
    owner: ultra-relay
    group: ultra-relay
    mode: "0600"
  no_log: true
- name: Publish runtime fleet public identity for exit authorization
  ansible.builtin.set_fact:
    ultra_fleet_access_public_key: "{{ fleet_public_key.stdout | trim }}"
  no_log: true
