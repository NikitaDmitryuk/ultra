---
- name: Validate fixed restore phase and private target
  ansible.builtin.assert:
    that:
      - >-
        ultra_restore_phase in ['prepare', 'install', 'database', 'peer_reseed', 'activate',
        'ingress', 'automation', 'ready', 'migration-bot', 'migration-controller']
      - ultra_restore_id is match('^[a-f0-9]{64}$')
      - ultra_restore_directory == '/var/lib/ultra-restore/' + ultra_restore_id
- name: Inspect private restore staging ancestors
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: [/var/lib/ultra-restore, "{{ ultra_restore_directory }}"]
  register: restore_staging_paths
- name: Reject restore staging symlinks
  ansible.builtin.assert:
    that: not item.stat.islnk | default(false)
  loop: "{{ restore_staging_paths.results }}"
- name: Create private restore parent
  ansible.builtin.file:
    path: /var/lib/ultra-restore
    state: directory
    owner: root
    group: root
    mode: "0700"
- name: Create private authenticated restore staging
  ansible.builtin.file:
    path: "{{ ultra_restore_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
- name: Transfer release-owned data validation helpers
  ansible.builtin.copy:
    src: "{{ ultra_restore_script_directory }}/{{ item }}"
    dest: "{{ ultra_restore_directory }}/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop: [restore_host.py, restore_common.py, restore_peer.py, recovery.py, dns.py, recovery_status.py]
- name: Recheck fencing before any host preparation
  ansible.builtin.command:
    argv: [python3, "{{ ultra_restore_directory }}/restore_host.py", --directory, "{{ ultra_restore_directory }}", --phase, fence-check]
    stdin: "{{ ultra_restore_plan | to_json(preprocess_unsafe=False) }}"
  changed_when: false
  no_log: true
- name: Prepare target dependencies
  ansible.builtin.apt:
    name: [postgresql-16, postgresql-client-16, nginx, libnginx-mod-stream, certbot, dnsutils, age, openssh-client, curl, openssl, ca-certificates, iproute2]
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ultra_restore_phase == 'prepare'
- name: Ensure supported restored service accounts
  ansible.builtin.user:
    name: "{{ item }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
  loop: [ultra-relay, ultra-bot]
  when: ultra_restore_phase == 'prepare'
- name: Restore authenticated generation transport
  ansible.builtin.copy:
    src: "{{ ultra_restore_stage_archive }}"
    dest: "{{ ultra_restore_directory }}/stage.tar.gz"
    owner: root
    group: root
    mode: "0600"
  when: ultra_restore_phase == 'install'
- name: Run fenced data integrity phase
  ansible.builtin.command:
    argv:
      - python3
      - "{{ ultra_restore_directory }}/restore_host.py"
      - --directory
      - "{{ ultra_restore_directory }}"
      - --phase
      - "{{ 'fence-check' if ultra_restore_phase in ['migration-bot', 'migration-controller'] else ultra_restore_phase }}"
    stdin: "{{ ultra_restore_plan | to_json(preprocess_unsafe=False) }}"
  register: restore_data_phase
  changed_when: false
  no_log: true
- name: Inspect restored recovery metadata directories
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: [/etc/ultra-ansible, /var/lib/ultra-ansible, /var/lib/ultra-ansible/channel, /var/lib/ultra-ansible/retention]
  register: restore_metadata_directories
  when: ultra_restore_phase == 'install'
- name: Reject non-directory restored recovery metadata
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isdir | default(false) and not item.stat.islnk | default(false))
  loop: "{{ restore_metadata_directories.results }}"
  when: ultra_restore_phase == 'install'
- name: Restore empty recovery metadata directories omitted by file-only archives
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: [/etc/ultra-ansible, /var/lib/ultra-ansible, /var/lib/ultra-ansible/channel, /var/lib/ultra-ansible/retention]
  when: ultra_restore_phase == 'install'
- name: Inspect restored canonical deployment configuration
  ansible.builtin.stat:
    path: /etc/ultra-ansible/install.config
  register: restore_canonical_configuration
  when: ultra_restore_phase == 'install'
- name: Require a private regular root-owned restored deployment configuration
  ansible.builtin.assert:
    that:
      - restore_canonical_configuration.stat.isreg | default(false)
      - not restore_canonical_configuration.stat.islnk | default(false)
      - restore_canonical_configuration.stat.uid == 0
      - restore_canonical_configuration.stat.mode == '0600'
  when:
    - ultra_restore_phase == 'install'
    - restore_canonical_configuration.stat.exists | default(false)
  no_log: true
- name: Relocate restored deployment configuration through the canonical Go parser
  ansible.builtin.command:
    argv:
      - /usr/local/bin/ultra-install
      - rewrite-deployment-config
      - --input
      - /etc/ultra-ansible/install.config
      - --output
      - /etc/ultra-ansible/install.config
      - --old-bridge
      - "{{ ultra_restore_plan.old_bridge_address }}"
      - --new-bridge
      - "{{ ultra_restore_plan.new_bridge_address }}"
      - --new-ssh-host
      - "{{ ansible_host | default(inventory_hostname) }}"
      - --public-host
      - "{{ ultra_restore_plan.public_host }}"
      - --subscription-domain
      - "{{ ultra_restore_plan.subscription_domain }}"
      - --provider
      - "{{ ultra_restore_plan.new_bridge_provider }}"
  when:
    - ultra_restore_phase == 'install'
    - restore_canonical_configuration.stat.exists | default(false)
  changed_when: false
  no_log: true
- name: Verify restored automatic channel metadata through the shared strict decoder
  ansible.builtin.command:
    argv: [/usr/local/bin/ultra-install, verify-channel-state, --file, /var/lib/ultra-ansible/channel/state.json]
  changed_when: false
  no_log: true
  when: ultra_restore_phase == 'install'
- name: Bind the restored executor to the actual target machine
  ansible.builtin.include_role:
    name: controller
    tasks_from: identity
  vars:
    ultra_controller_bridge_address: "{{ ultra_restore_plan.new_bridge_address }}"  # noqa: var-naming[no-role-prefix]
  when: ultra_restore_phase == 'install'
- name: Read restored automation identity
  ansible.builtin.slurp:
    src: /etc/ultra-recovery/deployment.json
  register: restore_deployment_identity
  when: ultra_restore_phase == 'install'
  no_log: true
- name: Validate immutable restored controller path
  ansible.builtin.assert:
    that: >-
      (restore_deployment_identity.content | b64decode | from_json).controller_directory is
      match('^/opt/ultra-ansible/releases/[A-Za-z0-9][A-Za-z0-9._-]{0,95}$')
  when:
    - ultra_restore_phase == 'install'
    - (restore_deployment_identity.content | b64decode | from_json).controller_directory | default('') | length > 0
  no_log: true
- name: Reconnect restored immutable controller runtime
  ansible.builtin.file:
    src: "{{ (restore_deployment_identity.content | b64decode | from_json).controller_directory }}"
    dest: /opt/ultra-ansible/current
    state: link
    owner: root
    group: root
  when:
    - ultra_restore_phase == 'install'
    - (restore_deployment_identity.content | b64decode | from_json).controller_directory | default('') | length > 0
  no_log: true
- name: Apply restored system service ownership
  ansible.builtin.include_tasks: services.yml
- name: Save authenticated data phase receipt
  ansible.builtin.copy:
    content: "{{ restore_data_phase.stdout | from_json | combine({'verified': true}) | to_json(preprocess_unsafe=False) }}"
    dest: "{{ ultra_result_file }}"
    mode: "0600"
  delegate_to: localhost
  no_log: true
