---
- name: Validate dedicated replication credential
  ansible.builtin.assert:
    that:
      - ultra_postgres.replication_password is match('^[a-f0-9]{64}$')
      - groups['bridge'] | length == 1
      - hostvars['bridge'].ultra_postgres_replica is defined
      - hostvars['bridge'].ultra_postgres_replica.password == ultra_postgres.replication_password
  no_log: true
- name: Authorize loopback physical replication with SCRAM
  ansible.builtin.blockinfile:
    path: /etc/postgresql/16/main/pg_hba.conf
    insertbefore: BOF
    marker: "# {mark} ultra-managed-replication"
    block: |
      host replication ultra_replication 127.0.0.1/32 scram-sha-256
  notify: Restart PostgreSQL
- name: Create missing restricted replication identity
  ansible.builtin.command:
    argv: [runuser, -u, postgres, --, psql, --no-psqlrc, --set, ON_ERROR_STOP=1, --tuples-only]
    stdin: |
      SET password_encryption = 'scram-sha-256';
      SELECT format('CREATE ROLE ultra_replication LOGIN REPLICATION NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD %L',
        '{{ ultra_postgres.replication_password }}')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'ultra_replication') \gexec
      SELECT 1 / count(*) FROM pg_roles WHERE rolname = 'ultra_replication'
        AND rolcanlogin AND rolreplication AND NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND NOT rolbypassrls
        AND NOT EXISTS (SELECT 1 FROM pg_auth_members WHERE member = pg_roles.oid);
  register: postgres_replication_role
  changed_when: "'CREATE ROLE' in postgres_replication_role.stdout"
  no_log: true
- name: Reconcile the derived replication credential when the app credential is trusted
  ansible.builtin.command:
    argv: [runuser, -u, postgres, --, psql, --no-psqlrc, --set, ON_ERROR_STOP=1, --tuples-only]
    stdin: |
      SET password_encryption = 'scram-sha-256';
      ALTER ROLE ultra_replication PASSWORD '{{ ultra_postgres.replication_password }}';
  changed_when: true
  when: ultra_postgres.reconcile_app_password | default(false) | bool
  no_log: true
