---
- name: Require supported PostgreSQL identity
  ansible.builtin.assert:
    that:
      - ultra_postgres.name is match('^[a-z_][a-z0-9_]*$')
      - ultra_postgres.user is match('^[a-z_][a-z0-9_]*$')
  no_log: true
- name: Configure PostgreSQL package repository
  ansible.builtin.import_tasks: repository.yml
- name: Install PostgreSQL 16
  ansible.builtin.apt:
    name: postgresql-16
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Ensure PostgreSQL active
  ansible.builtin.systemd_service:
    name: postgresql.service
    enabled: true
    state: started
- name: Configure bounded primary WAL and UTC
  ansible.builtin.lineinfile:
    path: /etc/postgresql/16/main/postgresql.conf
    regexp: "^#?\\s*{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
  loop:
    - { key: timezone, value: "'UTC'" }
    - { key: log_timezone, value: "'UTC'" }
    - { key: listen_addresses, value: "'127.0.0.1'" }
  notify: Restart PostgreSQL
- name: Install authenticated application application access
  ansible.builtin.blockinfile:
    path: /etc/postgresql/16/main/pg_hba.conf
    marker: "# {mark} ultra-managed-loopback"
    block: |
      host {{ ultra_postgres.name }} {{ ultra_postgres.user }} 127.0.0.1/32 scram-sha-256
  notify: Restart PostgreSQL
- name: Provision missing database roles without rotating existing credentials
  ansible.builtin.command:
    argv: [runuser, -u, postgres, --, psql, --no-psqlrc, --set, ON_ERROR_STOP=1, --tuples-only]
    stdin: |
      SELECT format('CREATE ROLE %I LOGIN PASSWORD %L',
        '{{ ultra_postgres.user }}', '{{ ultra_postgres.password | replace("'", "''") }}')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '{{ ultra_postgres.user }}') \gexec
      SELECT format('CREATE DATABASE %I OWNER %I', '{{ ultra_postgres.name }}', '{{ ultra_postgres.user }}')
        WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = '{{ ultra_postgres.name }}') \gexec
  register: postgres_create
  changed_when: "'CREATE' in postgres_create.stdout"
  no_log: true
- name: Authorize cluster identity observation in the application database
  ansible.builtin.command:
    argv: [runuser, -u, postgres, --, psql, --no-psqlrc, --set, ON_ERROR_STOP=1, --dbname, "{{ ultra_postgres.name }}"]
    stdin: |
      SELECT format('GRANT EXECUTE ON FUNCTION pg_control_system() TO %I', '{{ ultra_postgres.user }}') \gexec
  changed_when: false
  no_log: true
- name: Apply PostgreSQL settings
  ansible.builtin.meta: flush_handlers
- name: Verify application login before bridge activation; use DB_CREDENTIALS_FILE for an existing database
  ansible.builtin.command:
    argv:
      - /usr/lib/postgresql/16/bin/psql
      - --no-psqlrc
      - --no-password
      - --host
      - 127.0.0.1
      - --username
      - "{{ ultra_postgres.user }}"
      - --dbname
      - "{{ ultra_postgres.name }}"
      - --tuples-only
      - --command
      - SELECT 1
  environment:
    PGPASSWORD: "{{ ultra_postgres.password }}"
    PGCONNECT_TIMEOUT: "5"
  changed_when: false
  no_log: true
