---
- name: Handoff only the proof-bound controller without activating applications
  hosts: bridge
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Preserve normal controller fallback in the planned upgrade directory
      ansible.builtin.file:
        path: "/var/lib/ultra-ansible/releases/{{ ultra_release_version }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
    - name: Transition the controller through the existing release proof protocol
      ansible.builtin.import_tasks: ../roles/release/tasks/controller.yml
    - name: Select only the verified current tools dispatcher and complete live bundle
      ansible.builtin.command:
        argv: [/usr/bin/python3, "/opt/ultra-ansible/recovery-tools/{{ ultra_release_manifest_sha256 }}/prepare.py", activate-tools]
        stdin: "{{ {'request_sha256': ultra_recovery_preparation_request_sha256, 'started_at': 1} | to_json(preprocess_unsafe=False) }}"
      no_log: true
      changed_when: true
    - name: Return exact candidate handoff terminal acknowledgement
      ansible.builtin.copy:
        content: >-
          {{ {'verified': true, 'request_sha256': ultra_recovery_preparation_request_sha256, 'operation_id': ultra_lifecycle_id,
          'controller_directory': ultra_controller_directory} | to_json(preprocess_unsafe=False) }}
        dest: "{{ ultra_result_file }}"
        mode: "0600"
      delegate_to: localhost
      become: false
