---
- name: Inspect dedicated source and target before migration
  hosts: migration_sources:migration_targets
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Prepare the private read-only helper staging directory
      ansible.builtin.file:
        path: /var/lib/ultra-migration/inspect
        state: directory
        owner: root
        group: root
        mode: "0700"
    - name: Install release-owned read-only validation helpers
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../roles/bridge_migration/files/{{ item }}"
        dest: "/var/lib/ultra-migration/inspect/{{ item }}"
        owner: root
        group: root
        mode: "0600"
      loop: [inventory.py, state.py]
    - name: Read private host identity and compatibility evidence
      ansible.builtin.command:
        argv: [python3, /var/lib/ultra-migration/inspect/inventory.py, "{{ ultra_migration_host_role }}"]
      changed_when: false
      no_log: true
      register: bridge_migration_inventory
    - name: Save the private host identity result
      ansible.builtin.copy:
        content: "{{ bridge_migration_inventory.stdout | from_json | to_json(preprocess_unsafe=False) }}\n"
        dest: "{{ ultra_migration_local_directory }}/{{ inventory_hostname }}.json"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
- name: Confirm completion of the private preflight
  hosts: migration_sources
  gather_facts: false
  tasks:
    - name: Save the current preflight receipt
      ansible.builtin.copy:
        content: '{"verified": true}'
        dest: "{{ ultra_result_file }}"
        mode: "0600"
      delegate_to: localhost
      become: false
