---
- name: Stop only the selected managed replica tunnel
  hosts: bridges
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Validate managed tunnel identity
      ansible.builtin.assert:
        that: ultra_replica_slot is match('^ultra_[a-f0-9]{32}$')
    - name: Inspect installed managed tunnel
      ansible.builtin.stat:
        path: "/etc/systemd/system/ultra-replica-tunnel-{{ ultra_replica_slot }}.service"
      register: replica_stop_unit
    - name: Stop installed managed tunnel
      ansible.builtin.systemd_service:
        name: "ultra-replica-tunnel-{{ ultra_replica_slot }}.service"
        state: stopped
        enabled: false
      when: replica_stop_unit.stat.exists
    - name: Commit stopped tunnel acknowledgement
      ansible.builtin.copy:
        content: '{"verified":true}'
        dest: "{{ ultra_result_file }}"
        mode: "0600"
      delegate_to: localhost
