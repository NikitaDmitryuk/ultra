---
- name: Check recovery before an explicitly authorized repeat of the frozen operation
  hosts: bridge
  gather_facts: false
  any_errors_fatal: true
  vars:
    ultra_recovery_capture_tool: "{{ ultra_recovery_files | selectattr('destination', 'equalto', '/opt/ultra-recovery/recovery.py') | list | first }}"
  tasks:
    - name: Require unchanged frozen topology without waking producers
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../roles/release/files/state.py --expected {{ ultra_topology_sha256 }}"
        executable: /usr/bin/python3
      changed_when: false
      no_log: true
      when: ultra_legacy_bridge_maintenance | default(false) | bool
    - name: Prove the same held legacy barrier and start a new recovery watermark
      ultra_upgrade_maintenance:
        id: "{{ ultra_lifecycle_id }}"
        legacy_sha256: "{{ ultra_legacy_bridge_sha256 }}"
        phase: retry-checkpoint
        retry: "{{ ultra_legacy_retry_configuration | default({}) }}"
      register: legacy_retry_barrier
      when: ultra_legacy_bridge_maintenance | default(false) | bool
    - name: Require fresh independent recovery and unchanged topology
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../roles/release/files/state.py --expected {{ ultra_topology_sha256 }} --not-before 0"
        executable: /usr/bin/python3
      changed_when: false
      no_log: true
      when: not (legacy_retry_barrier.continuation | default(false) | bool) and (not (ultra_legacy_bridge_maintenance | default(false) | bool) or not (legacy_retry_barrier.held | default(false) | bool))
    - name: Verify the pinned recovery capture script immediately before execution
      ultra_upgrade_maintenance:
        id: "{{ ultra_lifecycle_id }}"
        legacy_sha256: "{{ ultra_legacy_bridge_sha256 }}"
        phase: capture-tool-check
        retry: "{{ ultra_legacy_retry_configuration | default({}) }}"
        recovery_tool_hashes: "{{ [ultra_recovery_capture_tool.previous_sha256, ultra_recovery_capture_tool.sha256] | reject('equalto', '') | list }}"
      when: legacy_retry_barrier.held | default(false) | bool
    - name: Stage the signed release collector immediately before capture
      ansible.builtin.include_role:
        name: release
        tasks_from: capture-tool
      when: legacy_retry_barrier.held | default(false) | bool
    - name: Capture fresh independent recovery while producers stay stopped
      ansible.builtin.command:
        argv: [python3, "/var/lib/ultra-ansible/upgrade/{{ ultra_lifecycle_id }}/capture/recovery.py", capture, --config, /etc/ultra-recovery/backup.json]
      changed_when: false
      no_log: true
      when: legacy_retry_barrier.held | default(false) | bool
    - name: Verify fresh same-primary delivery before authorizing activation reset
      ultra_upgrade_maintenance:
        id: "{{ ultra_lifecycle_id }}"
        legacy_sha256: "{{ ultra_legacy_bridge_sha256 }}"
        phase: recovery-ready
        retry: "{{ ultra_legacy_retry_configuration | default({}) }}"
      when: legacy_retry_barrier.held | default(false) | bool
    - name: Save the private current retry preflight result
      ansible.builtin.copy:
        content: '{"verified": true}'
        dest: "{{ ultra_result_file }}"
        mode: "0600"
      delegate_to: localhost
      become: false
