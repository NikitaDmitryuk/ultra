---
- name: Read a checked runtime topology and prerequisites
  hosts: bridge
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Read protected release readiness and owned topology
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../roles/release/files/state.py"
        executable: /usr/bin/python3
      changed_when: false
      no_log: true
      register: release_inspection
    - name: Save the private frozen inspection result
      ansible.builtin.copy:
        content: "{{ release_inspection.stdout | from_json | to_json(preprocess_unsafe=False) }}\n"
        dest: "{{ ultra_result_file }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
