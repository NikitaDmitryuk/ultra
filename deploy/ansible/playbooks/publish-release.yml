---
- name: Publish exact candidate recovery identity under the fleet lease
  hosts: bridge
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Publish the checked target with an immutable prior identity
      ansible.builtin.include_role:
        name: release
        tasks_from: publish
    - name: Save the current publication receipt without declaring fleet success
      ansible.builtin.copy:
        content: "{{ {'verified': true, 'version': ultra_release_version} | to_json(preprocess_unsafe=False) }}"
        dest: "{{ ultra_result_file }}"
        mode: "0600"
      delegate_to: localhost
      become: false
