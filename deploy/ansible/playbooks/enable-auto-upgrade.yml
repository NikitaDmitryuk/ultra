---
- name: Verify the exact signed bridge identity before stable channel acceptance
  hosts: bridge
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Validate exact signed and installed target artifacts
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../roles/release/files/auto_accept.py {{ ultra_release_version | quote }}"
        executable: /usr/bin/python3
      register: release_accept_identity
      changed_when: false
      no_log: true
- name: Verify exact current exit artifacts and fresh payload before acceptance
  hosts: exits
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Read the actual installed exit architecture
      ansible.builtin.command:
        argv: [dpkg, --print-architecture]
      register: release_accept_architecture
      changed_when: false
    - name: Select one signed artifact for this architecture
      ansible.builtin.set_fact:
        release_accept_assets: >-
          {{ ultra_accepted_manifest.assets |
          selectattr('name', 'equalto', 'ultra-relay-linux-' + release_accept_architecture.stdout) | list }}
    - name: Require one unambiguous signed exit artifact
      ansible.builtin.assert:
        that: release_accept_assets | length == 1
    - name: Inspect installed exit relay checksum
      ansible.builtin.stat:
        path: /usr/local/bin/ultra-relay
        checksum_algorithm: sha256
        follow: false
      register: release_accept_relay
    - name: Require the exact manifest artifact
      ansible.builtin.assert:
        that:
          - release_accept_relay.stat.isreg | default(false)
          - not release_accept_relay.stat.islnk | default(false)
          - release_accept_relay.stat.checksum == release_accept_assets[0].sha256
    - name: Require current real payload through this exit
      ansible.builtin.command:
        argv: [/opt/ultra-ansible/current/ultra-install, release-probe, --exit-id, "{{ ultra_exit_id }}", --since, "{{ ultra_accept_observed_at | string }}"]
      delegate_to: bridge
      changed_when: false
      no_log: true
- name: Enable the channel only after independent recovery and all fleet checks
  hosts: bridge
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Recheck fresh independent copy replicas and monitor-controller evidence
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../roles/release/files/state.py --status"
        executable: /usr/bin/python3
      register: release_accept_evidence
      changed_when: false
      no_log: true
    - name: Require complete current recovery readiness
      ansible.builtin.assert:
        that:
          - (release_accept_evidence.stdout | from_json).ready
          - (release_accept_evidence.stdout | from_json).independent
          - (release_accept_evidence.stdout | from_json).version == ultra_release_version
      no_log: true
    - name: Read the generated private channel policy
      ansible.builtin.slurp:
        src: /etc/ultra-ansible/auto-upgrade.json
      register: release_accept_policy
      no_log: true
    - name: Inspect durable identity-only channel metadata
      ansible.builtin.stat:
        path: /var/lib/ultra-ansible/channel/state.json
        follow: false
      register: release_accept_channel_stat
    - name: Reject nonprivate or nonregular existing channel metadata
      ansible.builtin.assert:
        that:
          - release_accept_channel_stat.stat.isreg | default(false)
          - not release_accept_channel_stat.stat.islnk | default(false)
          - release_accept_channel_stat.stat.mode == '0600'
      when: release_accept_channel_stat.stat.exists
    - name: Validate restored channel metadata with the canonical decoder
      ansible.builtin.command:
        argv: [/opt/ultra-ansible/current/ultra-install, verify-channel-state]
      changed_when: false
    - name: Record exact accepted identity under the application metadata mutex
      ansible.builtin.command:
        argv:
          - /opt/ultra-ansible/current/ultra-install
          - accept-channel-state
          - --version
          - "{{ (release_accept_identity.stdout | from_json).version }}"
          - --source-commit
          - "{{ (release_accept_identity.stdout | from_json).source_commit }}"
          - --manifest-sha256
          - "{{ (release_accept_identity.stdout | from_json).manifest_sha256 }}"
      no_log: true
      changed_when: true
    - name: Activate only the previously generated signed policy
      ansible.builtin.copy:
        content: "{{ release_accept_policy.content | b64decode | from_json | combine({'enabled': true}) | to_nice_json(preprocess_unsafe=False) }}"
        dest: /etc/ultra-ansible/auto-upgrade.json
        owner: root
        group: root
        mode: "0600"
      no_log: true
      diff: false
    - name: Enable stable release polling after explicit acceptance
      ansible.builtin.systemd_service:
        name: ultra-auto-upgrade.timer
        enabled: true
        state: started
        daemon_reload: true
    - name: Record the current accepted channel receipt
      ansible.builtin.copy:
        content: "{{ {'verified': true, 'version': ultra_release_version} | to_json(preprocess_unsafe=False) }}"
        dest: "{{ ultra_result_file }}"
        mode: "0600"
      delegate_to: localhost
      become: false
