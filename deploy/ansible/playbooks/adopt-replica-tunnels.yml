---
- name: Require exact frozen replica transport targets before any remote action
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Reject missing or noncanonical transport targets
      ansible.builtin.assert:
        that:
          - ultra_bootstrap_replica_host is defined
          - ultra_bootstrap_replica_host | default('') is match('^exit_(0|[1-9][0-9]*)$')
          - ultra_bootstrap_replica_host | default('') in groups.get('exits', [])
          - groups.get('bridge', []) == ['bridge']
          - ultra_replica_address is defined
          - hostvars[ultra_bootstrap_replica_host].ansible_host == ultra_replica_address
        quiet: true
      no_log: true
- name: Verify authoritative primary before adopting existing replica transport
  hosts: bridge
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require one bridge and a canonical frozen exit target
      ansible.builtin.assert:
        that:
          - groups['bridge'] | length == 1
          - ultra_bootstrap_replica_host is match('^exit_(0|[1-9][0-9]*)$')
          - ultra_bootstrap_replica_host in groups['exits']
          - hostvars[ultra_bootstrap_replica_host].ansible_host == ultra_replica_address
        quiet: true
    - name: Inspect primary generation and physical slot without mutation
      ultra_replica_adoption_guard:
        action: primary
        port: "{{ ultra_replica_primary_port }}"
        slot: "{{ ultra_replica_slot }}"
      register: replica_adoption_primary
      no_log: true

- name: Verify existing owned standby before installing transport
  hosts: "{{ ultra_bootstrap_replica_host | default('__ultra_missing_replica_target__') }}"
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require one authoritative primary transport target
      ansible.builtin.assert:
        that:
          - groups['bridge'] == ['bridge']
          - ansible_play_hosts_all | length == 1
          - inventory_hostname == ultra_bootstrap_replica_host
        quiet: true
    - name: Verify existing standby identity without reseeding or changing PostgreSQL
      ultra_replica_adoption_guard:
        action: standby
        slot: "{{ ultra_replica_slot }}"
        address: "{{ ultra_replica_address }}"
        system_id: "{{ hostvars[groups['bridge'][0]].replica_adoption_primary.system_id }}"
      register: replica_adoption_standby
      no_log: true

- name: Adopt independent transport for the verified existing standby
  hosts: bridge
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Require completed standby verification before transport mutation
      ansible.builtin.assert:
        that:
          - hostvars[ultra_bootstrap_replica_host].replica_adoption_standby.verified | default(false) | bool
        quiet: true
      no_log: true
  roles:
    - replica_tunnel
  post_tasks:
    - name: Commit verified transport adoption acknowledgement
      ansible.builtin.copy:
        content: '{"verified":true}'
        dest: "{{ ultra_result_file }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
