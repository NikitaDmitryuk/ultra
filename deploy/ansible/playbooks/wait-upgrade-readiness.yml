---
- name: Wait for public recovery evidence before acquiring the upgrade lease
  hosts: bridge
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Wait without discovery or private topology inspection
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/../roles/release/files/state.py --wait-readiness --lifecycle-id
          {{ ultra_readiness_lifecycle_id }}
          {{ '--reservation-pending' if ultra_readiness_reservation_pending | bool else '' }}
        executable: /usr/bin/python3
      become: true
      changed_when: false
      no_log: true
      register: release_readiness
    - name: Save only the public readiness result
      ansible.builtin.copy:
        content: "{{ release_readiness.stdout | from_json | to_json(preprocess_unsafe=False) }}\n"
        dest: "{{ ultra_result_file }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
