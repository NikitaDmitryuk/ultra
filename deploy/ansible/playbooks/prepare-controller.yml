---
- name: Prepare the independent bridge broker before any fleet mutation
  hosts: bridge
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Inspect whether the existing control worker supports persistent gates
      ultra_adoption_guard:
        id: "{{ ultra_lifecycle_id }}"
      register: adoption_existing
    - name: Ensure the broker submitter identity exists
      ansible.builtin.user:
        name: ultra-relay
        system: true
        create_home: false
        shell: /usr/sbin/nologin
    - name: Pause old schedules without interrupting a running generation
      when: not adoption_existing.fresh | bool
      block:
        - name: Inspect previously active recovery schedules
          ansible.builtin.command:
            argv: [systemctl, is-active, "{{ item }}"]
          changed_when: false
          failed_when: adoption_timer.rc not in [0, 3, 4]
          register: adoption_timer
          loop: [ultra-recovery-backup.timer, ultra-recovery-reconcile.timer]
        - name: Save original schedule activation for failure recovery
          ansible.builtin.copy:
            content: "{{ adoption_timer.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | list | to_json }}"
            dest: "{{ ultra_adoption_schedules_file }}"
            mode: "0600"
            force: false
          delegate_to: localhost
          become: false
        - name: Stop schedules for this maintenance window
          ansible.builtin.systemd_service:
            name: "{{ item.item }}"
            state: stopped
          loop: "{{ adoption_timer.results }}"
          when: item.rc == 0
        - name: Wait for an already running generation and reconcile to finish
          ultra_recovery_idle:
            service: "{{ item }}"
          changed_when: false
          register: adoption_cycle
          until: adoption_cycle.idle | default(false) | bool
          retries: 110
          delay: 5
          loop: [ultra-recovery-backup.service, ultra-recovery-reconcile.service]
    - name: Ensure the private attempt contract directory
      ansible.builtin.file:
        path: "/var/lib/ultra-ansible/adoption/{{ ultra_lifecycle_id }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
    - name: Project the current pure generation verification contract
      ansible.builtin.copy:
        content: "{{ ultra_adoption_contract_content }}"
        dest: "/var/lib/ultra-ansible/adoption/{{ ultra_lifecycle_id }}/recovery_status.py"
        owner: root
        group: root
        mode: "0600"
    - name: Prepare a verified bounded legacy maintenance window
      when: adoption_existing.legacy | bool
      block:
        - name: Create and deliver the independent pre-adoption generation
          ansible.builtin.command:
            argv: [/usr/bin/python3, /opt/ultra-recovery/recovery.py, capture, --config, /etc/ultra-recovery/backup.json]
          changed_when: false
          no_log: true
        - name: Check emergency compatibility and save the previous application identity
          ultra_adoption_guard:
            id: "{{ ultra_lifecycle_id }}"
            action: checkpoint
            contract_sha256: "{{ ultra_adoption_contract_sha256 }}"
        - name: Save the recoverable maintenance checkpoint marker
          ansible.builtin.copy:
            content: '{"legacy":true}'
            dest: "{{ ultra_adoption_receipt_file }}"
            mode: "0600"
          delegate_to: localhost
          become: false
        - name: Stop the old control worker within its normal bounded service shutdown
          ansible.builtin.systemd_service:
            name: ultra-relay.service
            state: stopped
    - name: Inspect a previous independent broker unit
      ansible.builtin.stat:
        path: /etc/systemd/system/ultra-ansible-controller.service
      register: adoption_broker_unit
    - name: Stop the previous broker while retaining immutable pending jobs
      ansible.builtin.systemd_service:
        name: ultra-ansible-controller.service
        state: stopped
      when: adoption_broker_unit.stat.exists
    - name: Ensure the private broker state directory
      ansible.builtin.file:
        path: /var/lib/ultra-ansible
        state: directory
        owner: root
        group: root
        mode: "0700"
    - name: Persist the topology reservation before the new broker starts
      ultra_adoption_guard:
        id: "{{ ultra_lifecycle_id }}"
        action: prepare-gate
    - name: Install the immutable verified broker runtime
      ansible.builtin.include_role:
        name: controller
    - name: Record the prepared broker
      ansible.builtin.copy:
        content: >-
          {{ {'verified': true, 'legacy': adoption_existing.legacy,
          'fresh': adoption_existing.fresh, 'stopped': adoption_existing.stopped} | to_json }}
        dest: "{{ ultra_result_file }}"
        mode: "0600"
      delegate_to: localhost
      become: false
