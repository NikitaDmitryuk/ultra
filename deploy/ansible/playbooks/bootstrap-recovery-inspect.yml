---
- name: Freeze recovery repair inventory without requiring a working backup
  hosts: bridge
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Read owned topology and immutable installed generation
      ultra_recovery_tools_bootstrap:
        phase: inventory
      register: bootstrap_inventory
      no_log: true
    - name: Retain the private repair inventory
      ansible.builtin.copy:
        content: "{{ bootstrap_inventory.inventory | to_json(preprocess_unsafe=False) }}\n"
        dest: "{{ ultra_result_file }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
