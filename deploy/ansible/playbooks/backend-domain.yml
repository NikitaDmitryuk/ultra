---
- name: Migrate backend certificate name preserving public ingress
  hosts: bridge
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Execute bounded backend migration
      ansible.builtin.include_role:
        name: backend_domain
- name: Confirm verified backend operation
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Save verified backend result
      ansible.builtin.copy:
        content: '{"verified":true}'
        dest: "{{ ultra_result_file }}"
        mode: "0600"
      no_log: true
