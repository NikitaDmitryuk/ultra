---
- name: Recheck old-primary fencing before every data or activation phase
  hosts: migration_sources
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Read the old host identity
      ansible.builtin.slurp:
        src: /etc/machine-id
      register: bridge_migration_fenced_machine
    - name: Require the original bound source machine
      ansible.builtin.assert:
        that: bridge_migration_fenced_machine.content | b64decode | trim == ultra_migration_source_machine_id
    - name: Require old application and database units to remain stopped
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ item }}"]
      changed_when: false
      register: bridge_migration_fenced_units
      failed_when: bridge_migration_fenced_units.rc != 3
      loop: [ultra-relay.service, ultra-bot.service, postgresql]
    - name: Require no responding old database listener
      ansible.builtin.command:
        argv: [pg_isready, -h, 127.0.0.1, -p, "5432", -t, "3"]
      changed_when: false
      register: bridge_migration_fenced_port
      failed_when: bridge_migration_fenced_port.rc != 2
    - name: Save the current fencing acknowledgement
      ansible.builtin.copy:
        content: '{"fenced": true}'
        dest: "{{ ultra_result_file }}"
        mode: "0600"
      delegate_to: localhost
      become: false
- name: Recheck the intended target identity
  hosts: migration_targets
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Read the new host identity
      ansible.builtin.slurp:
        src: /etc/machine-id
      register: bridge_migration_target_machine
    - name: Require the original bound target machine
      ansible.builtin.assert:
        that: bridge_migration_target_machine.content | b64decode | trim == ultra_migration_target_machine_id
