---
- name: Restore compatible exits from the frozen topology
  hosts: exits
  gather_facts: false
  serial: 1
  tasks:
    - name: Restore compatible exit tools
      ansible.builtin.include_role:
        name: release
        tasks_from: rollback-tools
    - name: Restore the relay executable
      ansible.builtin.include_role:
        name: release
        tasks_from: rollback
      vars:
        release_component: ultra-relay
- name: Restore the bridge without reverting database or local accounting
  hosts: bridge
  gather_facts: false
  tasks:
    - name: Stop the bot until relay readiness is verified
      ansible.builtin.systemd_service:
        name: ultra-bot.service
        state: stopped
    - name: Restore compatible bridge tools
      ansible.builtin.include_role:
        name: release
        tasks_from: rollback-tools
    - name: Restore the independent controller
      ansible.builtin.include_role:
        name: release
        tasks_from: rollback-controller
    - name: Restore the bridge relay
      ansible.builtin.include_role:
        name: release
        tasks_from: rollback
      vars:
        release_component: ultra-relay
    - name: Require a usable restored control plane
      ansible.builtin.command:
        argv: ["{{ ultra_release_probe_executable | default('/usr/local/bin/ultra-install') }}", release-probe]
      changed_when: false
      no_log: true
    - name: Restore the bot executable
      ansible.builtin.include_role:
        name: release
        tasks_from: rollback
      vars:
        release_component: ultra-bot
    - name: Restore the prior exact recovery manifest and signature
      ansible.builtin.include_role:
        name: release
        tasks_from: rollback-manifest
    - name: Start the bot only after restored relay readiness
      ansible.builtin.systemd_service:
        name: ultra-bot.service
        state: started
    - name: Save the verified operation result
      ansible.builtin.copy:
        content: "{{ {'operation': 'rollback', 'version': ultra_release_version | default(''), 'verified': true} | to_json(preprocess_unsafe=False) }}\n"
        dest: "{{ ultra_result_file }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
