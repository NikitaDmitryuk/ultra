---
- name: Verify whether legacy activation reached its first mutation barrier
  hosts: bridge
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Verify controller rollback enforcement before fleet mutation
      ansible.builtin.include_role:
        name: release
        tasks_from: controller-rollback-preflight
    - name: Verify the owned legacy checkpoint or unchanged running legacy topology
      ultra_upgrade_maintenance:
        id: "{{ ultra_lifecycle_id }}"
        legacy_sha256: "{{ ultra_legacy_bridge_sha256 }}"
        phase: rollback-check
        initial_runtime_request_json: "{{ ultra_legacy_initial_runtime_request_json | default('') }}"
      register: legacy_rollback_barrier
      when: ultra_legacy_bridge_maintenance | default(false) | bool
- name: Restore compatible exits from the frozen topology
  hosts: exits
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  tasks:
    - name: Restore compatible exit tools
      when: not (hostvars['bridge'].legacy_rollback_barrier.untouched | default(false) | bool)
      ansible.builtin.include_role:
        name: release
        tasks_from: rollback-tools
    - name: Restore the relay executable
      when: not (hostvars['bridge'].legacy_rollback_barrier.untouched | default(false) | bool)
      ansible.builtin.include_role:
        name: release
        tasks_from: rollback
      vars:
        release_component: ultra-relay
- name: Restore the bridge without reverting database or local accounting
  hosts: bridge
  gather_facts: false
  tasks:
    - name: Stop the bot until relay readiness is verified
      when: not (hostvars['bridge'].legacy_rollback_barrier.untouched | default(false) | bool)
      ansible.builtin.systemd_service:
        name: ultra-bot.service
        state: stopped
    - name: Restore compatible bridge tools
      when: not (hostvars['bridge'].legacy_rollback_barrier.untouched | default(false) | bool)
      ansible.builtin.include_role:
        name: release
        tasks_from: rollback-tools
    - name: Restore the independent controller
      when: not (hostvars['bridge'].legacy_rollback_barrier.untouched | default(false) | bool)
      ansible.builtin.include_role:
        name: release
        tasks_from: rollback-controller
    - name: Restore the bridge relay
      when: not (hostvars['bridge'].legacy_rollback_barrier.untouched | default(false) | bool)
      ansible.builtin.include_role:
        name: release
        tasks_from: rollback
      vars:
        release_component: ultra-relay
    - name: Start the unchanged restored legacy bridge before probing it
      ansible.builtin.systemd_service:
        name: ultra-relay.service
        state: started
      when: (ultra_legacy_bridge_maintenance | default(false) | bool) and (not (hostvars['bridge'].legacy_rollback_barrier.untouched | default(false) | bool))
    - name: Require a usable restored control plane
      when: not (hostvars['bridge'].legacy_rollback_barrier.untouched | default(false) | bool)
      ansible.builtin.command:
        argv: ["{{ ultra_release_probe_executable | default('/usr/local/bin/ultra-install') }}", release-probe]
      changed_when: false
      no_log: true
    - name: Restore the bot executable
      when: not (hostvars['bridge'].legacy_rollback_barrier.untouched | default(false) | bool)
      ansible.builtin.include_role:
        name: release
        tasks_from: rollback
      vars:
        release_component: ultra-bot
    - name: Restore the prior exact recovery manifest and signature
      when: not (hostvars['bridge'].legacy_rollback_barrier.untouched | default(false) | bool)
      ansible.builtin.include_role:
        name: release
        tasks_from: rollback-manifest
    - name: Restore the original legacy bot state after the restored bridge probe
      ultra_upgrade_maintenance:
        id: "{{ ultra_lifecycle_id }}"
        legacy_sha256: "{{ ultra_legacy_bridge_sha256 }}"
        phase: restore-services
      when: (ultra_legacy_bridge_maintenance | default(false) | bool) and (not (hostvars['bridge'].legacy_rollback_barrier.untouched | default(false) | bool))
    - name: Start the bot only after restored relay readiness
      ansible.builtin.systemd_service:
        name: ultra-bot.service
        state: started
      when:
        - not (ultra_legacy_bridge_maintenance | default(false) | bool)
        - not (hostvars['bridge'].legacy_rollback_barrier.untouched | default(false) | bool)
    - name: Read the exact runtime effect rollback binding after executable restoration
      ultra_runtime_effects:
        action: status
        request_json: "{{ ultra_runtime_effect_inputs[inventory_hostname] }}"
        warp_assets: "{{ ultra_runtime_warp_assets }}"
      register: release_runtime_effect_binding
      when: (ultra_runtime_effect_inputs is defined) and (not (hostvars['bridge'].legacy_rollback_barrier.untouched | default(false) | bool))
      no_log: true
    - name: Restore prior enabled state and external effects after executable restoration
      ultra_runtime_effects:
        action: rollback
        request_json: "{{ ultra_runtime_effect_inputs[inventory_hostname] }}"
        warp_assets: "{{ ultra_runtime_warp_assets }}"
      when:
        - not (hostvars['bridge'].legacy_rollback_barrier.untouched | default(false) | bool)
        - ultra_runtime_effect_inputs is defined
        - release_runtime_effect_binding.bound | default(false) | bool
      no_log: true
    - name: Restore prior bot activity as the final release compensation
      ultra_runtime_effects:
        action: accept-rollback
        request_json: "{{ ultra_runtime_effect_inputs[inventory_hostname] }}"
        warp_assets: "{{ ultra_runtime_warp_assets }}"
      when:
        - not (hostvars['bridge'].legacy_rollback_barrier.untouched | default(false) | bool)
        - ultra_runtime_effect_inputs is defined
        - release_runtime_effect_binding.bound | default(false) | bool
      no_log: true
    - name: Save the verified operation result
      ansible.builtin.copy:
        content: "{{ {'operation': 'rollback', 'version': ultra_release_version | default(''), 'verified': true} | to_json(preprocess_unsafe=False) }}\n"
        dest: "{{ ultra_result_file }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
