---
- name: Reconcile dedicated exit DNS before HTTP-01 issuance
  hosts: bridge
  gather_facts: false
  any_errors_fatal: true
  roles:
    - role: dns
      when: ultra_dns_desired is defined and 'tunnel' in ultra_dns_desired
- name: Generate application database tunnel identity
  hosts: bridge
  gather_facts: false
  any_errors_fatal: true
  roles:
    - postgres_client
    - role: db_tunnel
      db_tunnel_ultra_stage: generate
      when: groups['databases'] | length > 0
- name: Configure primary database
  hosts: databases
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Require the dedicated database inventory target
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'database'
          - ansible_host == ultra_db_tunnel_host
    - name: Install client tools for archive validation
      ansible.builtin.include_role:
        name: postgres_client
      when: ultra_database_import_dump | default('') | length > 0
    - name: Check archive and existing database before provisioning
      ansible.builtin.include_role:
        name: database_import
        tasks_from: preflight
      when: ultra_database_import_dump | default('') | length > 0
  roles:
    - role: postgres
      when: ultra_postgres is defined
    - role: database_import
      when: ultra_database_import_dump | default('') | length > 0
- name: Authorize application database tunnel
  hosts: databases
  gather_facts: false
  any_errors_fatal: true
  roles:
    - role: db_tunnel
      db_tunnel_ultra_stage: authorize
- name: Activate application database tunnel
  hosts: bridge
  gather_facts: false
  any_errors_fatal: true
  roles:
    - role: db_tunnel
      db_tunnel_ultra_stage: install
      when: groups['databases'] | length > 0
- name: Prepare primary replication slot and identity
  hosts: databases
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Observe primary cluster identity
      ansible.builtin.command:
        argv: [runuser, -u, postgres, --, psql, --no-psqlrc, --set, ON_ERROR_STOP=1, --tuples-only, --no-align]
        stdin: |
          SELECT system_identifier FROM pg_control_system() WHERE NOT pg_is_in_recovery();
      register: postgres_replica_primary_identity
      changed_when: false
    - name: Require a primary system identifier
      ansible.builtin.assert:
        that: postgres_replica_primary_identity.stdout | trim is match('^[0-9]+$')
    - name: Observe recovery parameters and reject external tablespaces
      ansible.builtin.command:
        argv: [runuser, -u, postgres, --, psql, --no-psqlrc, --set, ON_ERROR_STOP=1, --tuples-only, --no-align]
        stdin: |
          SELECT 1 / CASE WHEN EXISTS (SELECT 1 FROM pg_tablespace WHERE spcname NOT IN ('pg_default', 'pg_global')) THEN 0 ELSE 1 END;
          SELECT json_build_object('max_connections', current_setting('max_connections')::int,
            'max_worker_processes', current_setting('max_worker_processes')::int,
            'max_wal_senders', current_setting('max_wal_senders')::int,
            'max_prepared_transactions', current_setting('max_prepared_transactions')::int,
            'max_locks_per_transaction', current_setting('max_locks_per_transaction')::int);
      register: postgres_replica_primary_parameters
      changed_when: false
    - name: Ensure bounded persistent bridge replication slot
      ansible.builtin.command:
        argv: [runuser, -u, postgres, --, psql, --no-psqlrc, --set, ON_ERROR_STOP=1, --tuples-only]
        stdin: |
          SELECT * FROM pg_create_physical_replication_slot('ultra_bridge')
            WHERE NOT EXISTS (SELECT 1 FROM pg_replication_slots WHERE slot_name = 'ultra_bridge');
          SELECT 1 / count(*) FROM pg_replication_slots
            WHERE slot_name = 'ultra_bridge' AND slot_type = 'physical' AND NOT temporary
            AND (wal_status IS NULL OR wal_status <> 'lost');
      register: postgres_replica_slot
      changed_when: "'ultra_bridge' in postgres_replica_slot.stdout"
- name: Configure bridge physical standby
  hosts: bridge
  gather_facts: false
  any_errors_fatal: true
  roles:
    - role: postgres_replica
- name: Configure initial exits serially
  hosts: exits
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  roles:
    - host
    - role: warp
      when: ultra_warp_enabled | default(false) | bool
    - role: tunnel_certificate
      when: ultra_tunnel_domain | default('') | length > 0
    - relay
- name: Configure bridge after verified exit activation
  hosts: bridge
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Require adopted topology to have certificate receipts for every preserved route
      ansible.builtin.assert:
        that:
          - item.name in ultra_exit_hosts
        fail_msg: adopted_exit_topology_requires_verified_receipts
      loop: "{{ ultra_bootstrap_entries }}"
      when: ultra_preserve_runtime | default(false) | bool
      no_log: true
    - name: Verify preserved exit pins against actual certificate receipts
      ansible.builtin.assert:
        that:
          - item.pinned_peer_cert_sha256 | default('') is match('^[a-f0-9]{64}$')
          - (hostvars[ultra_exit_hosts[item.name]].relay_fingerprint.stdout.split('=')[-1] | replace(':', '') | lower) is match('^[a-f0-9]{64}$')
          - item.pinned_peer_cert_sha256 == (hostvars[ultra_exit_hosts[item.name]].relay_fingerprint.stdout.split('=')[-1] | replace(':', '') | lower)
        fail_msg: adopted_exit_certificate_pin_mismatch
      loop: "{{ ultra_bootstrap_entries }}"
      when: (ultra_preserve_runtime | default(false) | bool) and ultra_spec.tunnel_tls_provision != 'acme_letsencrypt'
      no_log: true
    - name: Require the frozen database topology before bridge activation
      ultra_adopt_topology:
        database: "{{ ultra_adoption_database }}"
        expected: "{{ ultra_adoption_topology_sha256 }}"
      when: ultra_preserve_runtime | default(false) | bool
      no_log: true
    - name: Start pinned bootstrap assembly
      ansible.builtin.set_fact:
        bootstrap_pinned: "{{ ultra_bootstrap_entries if ultra_preserve_runtime | default(false) | bool else [] }}"
      no_log: true
    - name: Resolve actual exit certificate pins
      ansible.builtin.set_fact:
        bootstrap_pinned: >-
          {{ bootstrap_pinned + [item | combine({'pinned_peer_cert_sha256':
             hostvars[ultra_exit_hosts[item.name]].relay_fingerprint.stdout.split('=')[-1] | replace(':', '') | lower})] }}
      loop: "{{ ultra_bootstrap_entries }}"
      no_log: true
      when: not (ultra_preserve_runtime | default(false) | bool) and ultra_spec.tunnel_tls_provision != 'acme_letsencrypt'
    - name: Use CA authentication for managed tunnel routes
      ansible.builtin.set_fact:
        bootstrap_pinned: "{{ ultra_bootstrap_entries }}"
      when: ultra_spec.tunnel_tls_provision == 'acme_letsencrypt'
      no_log: true
    - name: Preserve the primary exit certificate pin
      ansible.builtin.set_fact:
        ultra_spec: "{{ ultra_spec | combine({'exit': ultra_spec.exit | combine({'pinned_peer_cert_sha256': bootstrap_pinned[0].pinned_peer_cert_sha256})}) }}"
      no_log: true
      when: not (ultra_preserve_runtime | default(false) | bool) and ultra_spec.tunnel_tls_provision != 'acme_letsencrypt'
    - name: Reconcile uniquely matched imported exit identities before bridge activation
      ultra_dump_exit_identity:
        database: "{{ hostvars['database'].ultra_database_import_db }}"
        user: "{{ hostvars['database'].ultra_database_import_user }}"
        password: "{{ hostvars['database'].ultra_database_import_password }}"
        archive_sha256: "{{ hostvars['database'].ultra_database_import_sha256 }}"
        entries: "{{ bootstrap_pinned }}"
        tls_policy: "{{ 'ca' if ultra_spec.tunnel_tls_provision == 'acme_letsencrypt' else 'pin' }}"
      delegate_to: database
      when:
        - "'database' in hostvars"
        - hostvars['database'].ultra_database_import_sha256 | default('') | length > 0
        - not (ultra_preserve_runtime | default(false) | bool)
      no_log: true
  roles:
    - host
    - role: geo
      when: ultra_geo_enabled | default(false) | bool
    - relay
  tasks:
    - name: Install pinned bootstrap routes
      ansible.builtin.copy:
        content: "{{ bootstrap_pinned | to_nice_json(preprocess_unsafe=False) }}"
        dest: /etc/ultra-relay/exit_nodes.bootstrap.json
        owner: ultra-relay
        group: ultra-relay
        mode: "0600"
      no_log: true
      diff: false
      notify: Restart ultra relay
    - name: Activate bootstrap routes
      ansible.builtin.meta: flush_handlers

- name: Confirm completed bootstrap operation
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Persist the verified operation result
      ansible.builtin.copy:
        content: '{"verified": true}'
        dest: "{{ ultra_result_file }}"
        mode: "0600"
      no_log: true
