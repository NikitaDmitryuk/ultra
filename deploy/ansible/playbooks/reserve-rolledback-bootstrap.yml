---
- name: Reserve the original compatible rollback for another bootstrap generation
  hosts: bridge
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require the original checkpoint and exactly restored application identity
      ultra_adoption_guard:
        id: "{{ ultra_lifecycle_id }}"
        action: retry-check
      register: adoption_retry
    - name: Require a proved compatible legacy rollback
      ansible.builtin.assert:
        that: adoption_retry.verified | default(false) | bool
    - name: Fence the same operation before stopping its restored applications
      ultra_adoption_guard:
        id: "{{ ultra_lifecycle_id }}"
        action: prepare-gate
    - name: Inspect original recovery schedules
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ item }}"]
      loop: [ultra-recovery-backup.timer, ultra-recovery-reconcile.timer]
      register: adoption_retry_timers
      changed_when: false
      failed_when: adoption_retry_timers.rc not in [0, 3, 4]
    - name: Pause active schedules without replacing their original saved state
      ansible.builtin.systemd_service:
        name: "{{ item.item }}"
        state: stopped
      loop: "{{ adoption_retry_timers.results }}"
      when: item.rc == 0
    - name: Wait for the current recovery cycle to finish
      ultra_recovery_idle:
        service: "{{ item }}"
      changed_when: false
      register: adoption_retry_cycle
      until: adoption_retry_cycle.idle | default(false) | bool
      retries: 110
      delay: 5
      loop: [ultra-recovery-backup.service, ultra-recovery-reconcile.service]
    - name: Inspect a potentially installed bot unit
      ansible.builtin.stat:
        path: /etc/systemd/system/ultra-bot.service
      register: adoption_retry_bot
    - name: Stop a potentially installed bot
      ansible.builtin.systemd_service:
        name: ultra-bot.service
        state: stopped
      when: adoption_retry_bot.stat.exists
    - name: Stop the restored compatible relay
      ansible.builtin.systemd_service:
        name: ultra-relay.service
        state: stopped
    - name: Reserve the original UUID with a positively stopped worker
      ultra_lifecycle:
        id: "{{ ultra_lifecycle_id }}"
        phase: applying
        drain: false
    - name: Record the original reservation
      ansible.builtin.copy:
        content: '{"verified":true}'
        dest: "{{ ultra_result_file }}"
        mode: "0600"
      delegate_to: localhost
      become: false
