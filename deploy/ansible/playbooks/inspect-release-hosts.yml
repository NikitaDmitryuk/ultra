---
- name: Verify explicit prior operator evidence before selecting rollback baselines
  hosts: bridge
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Verify root receipts retained assets and emergency checkpoint
      ultra_upgrade_baseline:
        input: "{{ ultra_upgrade_baseline_input }}"
        nodes: "{{ ultra_upgrade_baseline_nodes }}"
        bridge_address: "{{ ultra_upgrade_baseline_bridge_address }}"
      register: upgrade_baseline_verified
      when: ultra_upgrade_baseline_input is defined
- name: Read exact frozen fleet architectures
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Read the architecture without installing anything
      ansible.builtin.command:
        argv: [dpkg, --print-architecture]
      changed_when: false
      register: release_architecture
    - name: Require a supported architecture
      ansible.builtin.assert:
        that: release_architecture.stdout in ['amd64', 'arm64']
    - name: Save the private per-host architecture
      ansible.builtin.copy:
        content: "{{ {'architecture': release_architecture.stdout} | to_json }}\n"
        dest: "{{ ultra_release_inspection_directory }}/{{ inventory_hostname }}.json"
        mode: "0600"
      delegate_to: localhost
      become: false
- name: Confirm completion of frozen fleet inspection
  hosts: bridge
  gather_facts: false
  tasks:
    - name: Save the current inspection result
      ansible.builtin.copy:
        content: >-
          {{ {'verified': true} |
             combine({'baseline': upgrade_baseline_verified.baseline}
                     if ultra_upgrade_baseline_input is defined else {}) |
             to_json(preprocess_unsafe=False) }}
        dest: "{{ ultra_result_file }}"
        mode: "0600"
      delegate_to: localhost
      become: false
