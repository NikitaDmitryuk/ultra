---
- name: Resume automation
  hosts: bridge
  gather_facts: false
  tasks:
    - name: Resume owned timers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
      loop:
        - ultra-recovery-backup.timer
        - ultra-recovery-reconcile.timer
    - name: Save the current resume receipt
      ansible.builtin.copy:
        content: "{{ {'resumed': true} | to_json(preprocess_unsafe=False) }}"
        dest: "{{ ultra_result_file }}"
        mode: "0600"
      delegate_to: localhost
      become: false
