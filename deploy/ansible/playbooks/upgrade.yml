---
- name: Freeze owned automation before activation
  hosts: bridge
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Select the pinned readiness tool
      ansible.builtin.set_fact:
        release_installer_asset: "{{ ultra_release_manifest.assets | selectattr('name', 'equalto', 'ultra-install-linux-' + ultra_architecture) | list }}"
    - name: Require an exact installer tool asset
      ansible.builtin.assert:
        that: release_installer_asset | length == 1
    - name: Inspect the pinned tool source
      ansible.builtin.stat:
        path: "{{ ultra_release_source }}/ultra-install-linux-{{ ultra_architecture }}"
        checksum_algorithm: sha256
        follow: false
      delegate_to: localhost
      become: false
      register: release_installer_source
    - name: Require exact readiness tool bytes
      ansible.builtin.assert:
        that:
          - release_installer_source.stat.isreg | default(false)
          - not release_installer_source.stat.islnk | default(false)
          - release_installer_source.stat.checksum == release_installer_asset[0].sha256
          - release_installer_source.stat.size | int == release_installer_asset[0].size | int
    - name: Prepare the private versioned readiness tool directory
      ansible.builtin.file:
        path: "/var/lib/ultra-ansible/releases/{{ ultra_release_version }}"
        state: directory
        mode: "0700"
    - name: Install the checked readiness tool without replacing the active executor
      ansible.builtin.copy:
        src: "{{ ultra_release_source }}/ultra-install-linux-{{ ultra_architecture }}"
        dest: "{{ ultra_release_probe_executable }}"
        owner: root
        group: root
        mode: "0755"
    - name: Stop new recovery cycles without interrupting running copies
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
      loop:
        - ultra-recovery-backup.timer
        - ultra-recovery-reconcile.timer
    - name: Wait for current copies and reconcile to finish naturally
      ultra_recovery_idle:
        service: "{{ item }}"
      register: release_cycle
      changed_when: false
      until: release_cycle.idle | default(false) | bool
      retries: 110
      delay: 5
      loop:
        - ultra-recovery-backup.service
        - ultra-recovery-reconcile.service
    - name: Require the same owned frozen topology
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../roles/release/files/state.py --expected {{ ultra_topology_sha256 }}"
        executable: /usr/bin/python3
      changed_when: false
      no_log: true
    - name: Create the independent control generation before activation
      ansible.builtin.command:
        argv: [python3, /opt/ultra-recovery/recovery.py, capture, --config, /etc/ultra-recovery/backup.json]
      changed_when: false
      no_log: true
- name: Update exits sequentially before bridge
  hosts: exits
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  vars:
    release_component: ultra-relay
  tasks:
    - name: Refresh verified exit runtime tools
      ansible.builtin.include_role:
        name: release
        tasks_from: tools
    - name: Activate the exit relay
      ansible.builtin.include_role:
        name: release
- name: Update the bridge after all exits pass payload verification
  hosts: bridge
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  tasks:
    - name: Stop the bot until relay readiness
      ansible.builtin.systemd_service:
        name: ultra-bot.service
        state: stopped
    - name: Activate the bridge relay
      ansible.builtin.include_role:
        name: release
      vars:
        release_component: ultra-relay
    - name: Activate the bot after relay readiness
      ansible.builtin.include_role:
        name: release
      vars:
        release_component: ultra-bot
    - name: Refresh verified bridge recovery tools
      ansible.builtin.include_role:
        name: release
        tasks_from: tools
    - name: Update the independent controller from the immutable release
      ansible.builtin.include_role:
        name: release
        tasks_from: controller
    - name: Read the completed activation time on the bridge
      ansible.builtin.command:
        argv: [date, '+%s']
      changed_when: false
      register: release_completed_at
    - name: Save the verified operation result
      ansible.builtin.copy:
        content: >-
          {{ {'operation': 'upgrade', 'version': ultra_release_version | default(''),
          'verified': true, 'activated_at': release_completed_at.stdout | int} |
          to_json(preprocess_unsafe=False) }}
        dest: "{{ ultra_result_file }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
