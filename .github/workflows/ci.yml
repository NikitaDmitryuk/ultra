name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint-test-build:
    name: Lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Set up Node.js for Mini App tests
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.21.0'

      - name: Test Happ import flow
        run: make test-ui

      - name: Check agent context and ADRs
        run: make harness-check

      - name: Verify dependencies
        run: go mod verify

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          args: --timeout 5m

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Build ultra-relay
        run: make build

      - name: Build ultra-install
        run: make build-install

      - name: Build ultra-bot
        run: make build-bot

      - name: Race tests
        run: make test-race

      - name: Build client and benchmark
        run: make build-client build-bench
