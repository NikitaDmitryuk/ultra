name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  go-quality:
    name: Go lint, vet and context
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Verify dependencies
        run: go mod verify
      - name: Check formatting
        run: make format-check
      - name: Lint
        run: make lint
      - name: Vet
        run: make vet
      - name: Check agent context and ADRs
        run: make harness-check
  go-tests:
    name: Go tests and PostgreSQL recovery
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ultra_ci_only
          POSTGRES_DB: ultra_ci
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d ultra_ci" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:ultra_ci_only@127.0.0.1:5432/ultra_ci?sslmode=disable
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Test
        run: make test
      - name: Verify imported exit identity preservation with PostgreSQL
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client
          python3 deploy/recovery/test_dump_exit_identity.py --test-dsn "$DATABASE_URL"
      - name: Dump and restore during VPN load
        run: python3 scripts/test-load-pg-recovery.py --container '${{ job.services.postgres.id }}'
  go-race:
    name: Go race tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ultra_ci_only
          POSTGRES_DB: ultra_ci
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d ultra_ci" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:ultra_ci_only@127.0.0.1:5432/ultra_ci?sslmode=disable
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Race tests
        run: make test-race
  build:
    name: Build all binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Build ultra-relay
        run: make build
      - name: Build ultra-install
        run: make build-install
      - name: Build ultra-bot
        run: make build-bot
      - name: Build client and benchmark
        run: make build-client build-bench
  ansible-validation:
    name: Ansible validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Set up Python for Ansible checks
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned Ansible validation tools
        run: python3 -m pip install 'ansible-core==2.20.0' 'ansible-lint==26.10.0'
      - name: Validate Ansible roles
        run: make test-ansible
      - name: Operator deployment and recovery regression tests
        run: make test-operator
      - name: Verify pinned Ansible failure and retry proofs
        run: ULTRA_TEST_ANSIBLE_PLAYBOOK="$(command -v ansible-playbook)" go test -count=1 ./cmd/ultra-install ./internal/deployansible -run '^(TestRecoveryPreparationNormalTaskFailureRetainsExactJobAndAllowsExplicitRetry|TestExecutionFenceRealAnsibleTaskFailureRetry)$'
  ansible-integration:
    name: Ansible SSH and offline runtime
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Set up Python for Ansible checks
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned Ansible validation tools
        run: python3 -m pip install 'ansible-core==2.20.0' 'ansible-lint==26.10.0'
      - name: Verify exit role and offline Ansible runtime
        run: |
          python3 scripts/build-ansible-runtime.py --architecture amd64 --output /tmp/ultra-ansible-runtime.tar.gz
          make build-install
          sudo -n /usr/bin/python3 scripts/test-ansible-exit.py --installer "$PWD/ultra-install" --ansible-playbook "$(command -v ansible-playbook)" --runtime /tmp/ultra-ansible-runtime.tar.gz
      - name: Verify isolated systemd execution faults and root SSH retry
        run: python3 scripts/test-execution-systemd.py --runtime /tmp/ultra-ansible-runtime.tar.gz
      - name: Verify repeated retained prepare-only admission with one backup
        run: python3 scripts/test-retained-prepare-repeat.py --runtime /tmp/ultra-ansible-runtime.tar.gz
      - name: Verify release rollback and recovery roles through SSH
        run: |
          python3 scripts/test-ansible-release.py --ansible-playbook "$(command -v ansible-playbook)"
          sudo -n /usr/bin/python3 scripts/test-ansible-recovery.py --installer "$PWD/ultra-install" --ansible-playbook "$(command -v ansible-playbook)"
          python3 scripts/test-ansible-forward-role.py --ansible-playbook "$(command -v ansible-playbook)"
      - name: Verify restricted bridge PostgreSQL standby observation
        run: |
          docker pull postgres:16
          python3 scripts/test-ansible-postgres-monitor.py
          python3 scripts/test-ansible-postgres-replica-slot.py
          python3 scripts/test-ansible-postgres-credential.py
      - name: Verify atomic imports with PostgreSQL 16
        run: python3 scripts/test-import-protocol-pg.py
  nginx:
    name: Primary XHTTP with actual Nginx
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Test primary XHTTP with actual Nginx
        env:
          ULTRA_TEST_NGINX_IMAGE: nginx:1.24@sha256:f6daac2445b0ce70e64d77442ccf62839f3f1b4c24bf6746a857eff014e798c8
        run: go test -race -gcflags='github.com/xtls/xray-core/proxy/vless/...=-d=checkptr=0' ./internal/config -run '^TestActualNginxPrimaryXHTTPServerFirstInteractiveSmallPayload$'
          -count=1
  ui-release:
    name: Mini App and release asset contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js for Mini App tests
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
      - name: Test Happ import flow
        run: make test-ui
      - name: Verify published release asset contract
        run: python3 scripts/test-release-assets.py
  recovery:
    name: Recovery and monitor tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
      - name: Set up Python for Ansible checks
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install recovery test dependencies
        run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Recovery and monitor tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q age openssh-server
          python3 -m unittest discover -s deploy/recovery -p 'test_*.py'
  lint-test-build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    needs:
      - go-quality
      - go-tests
      - go-race
      - build
      - ansible-validation
      - ansible-integration
      - nginx
      - ui-release
      - recovery
    if: ${{ always() }}
    steps:
      - name: Require every validation group to succeed
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: |-
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['CI_RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed:
              raise SystemExit(f"Validation groups did not succeed: {failed}")
          PYTHON
